<style>
/* ---------- tokens: light base set, shared with The Engineer's Syllabus ---------- */
:root {
  --paper:        #EFEFE9;
  --surface:      #F8F8F4;
  --surface-sunk: #E7E7E0;
  --ink:          #15181E;
  --ink-mid:      #3E444F;
  --ink-soft:     #5F656F;
  --rule:         #D3D3CA;
  --rule-soft:    #E1E1D9;
  --marine:       #1B3CC0;
  --marine-sunk:  #E2E5F7;
  --brass:        #7A5D10;
  --brass-sunk:   #EEE7D2;
  --ok:           #34694A;
  --ok-bg:        #E2ECE5;
  --gap:          #9E3728;
  --gap-bg:       #F5E2DE;
  --code-bg:      #F7F7F2;
  --code-ink:     #1E232B;
  --syn-kw:       #1B3CC0;
  --syn-str:      #7A560C;
  --syn-com:      #656C76;
  --syn-num:      #1C6B66;
  --syn-fn:       #15181E;
  --syn-meta:     #7A5D10;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #0E1115;
    --surface:      #161A20;
    --surface-sunk: #1C2128;
    --ink:          #E8E8E2;
    --ink-mid:      #B6BBC4;
    --ink-soft:     #8C939E;
    --rule:         #2A2F38;
    --rule-soft:    #212630;
    --marine:       #8EA3F7;
    --marine-sunk:  #1A2140;
    --brass:        #CBA94F;
    --brass-sunk:   #2A2416;
    --ok:           #74B78C;
    --ok-bg:        #16271C;
    --gap:          #E58C7E;
    --gap-bg:       #2E1A17;
    --code-bg:      #12161C;
    --code-ink:     #DADCD6;
    --syn-kw:       #9DB0FA;
    --syn-str:      #D8BC72;
    --syn-com:      #7F8794;
    --syn-num:      #72C7BF;
    --syn-fn:       #F2F2EC;
    --syn-meta:     #CBA94F;
  }
}
:root[data-theme="dark"] {
  --paper:        #0E1115;
  --surface:      #161A20;
  --surface-sunk: #1C2128;
  --ink:          #E8E8E2;
  --ink-mid:      #B6BBC4;
  --ink-soft:     #8C939E;
  --rule:         #2A2F38;
  --rule-soft:    #212630;
  --marine:       #8EA3F7;
  --marine-sunk:  #1A2140;
  --brass:        #CBA94F;
  --brass-sunk:   #2A2416;
  --ok:           #74B78C;
  --ok-bg:        #16271C;
  --gap:          #E58C7E;
  --gap-bg:       #2E1A17;
  --code-bg:      #12161C;
  --code-ink:     #DADCD6;
  --syn-kw:       #9DB0FA;
  --syn-str:      #D8BC72;
  --syn-com:      #7F8794;
  --syn-num:      #72C7BF;
  --syn-fn:       #F2F2EC;
  --syn-meta:     #CBA94F;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.64;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
  font-weight: 700;
  letter-spacing: -0.018em;
  text-wrap: balance;
  margin: 0;
}

a { color: var(--marine); text-decoration-color: color-mix(in srgb, var(--marine) 35%, transparent); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--marine); }
:focus-visible { outline: 2px solid var(--marine); outline-offset: 2px; border-radius: 2px; }

p code, li code, td code, dd code, summary code, .thesis code, figcaption code {
  font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  font-size: .84em;
  background: var(--surface-sunk);
  color: var(--ink);
  padding: 1px 5px;
  border-radius: 2px;
  overflow-wrap: anywhere;
}

/* ---------- shell ---------- */
.shell {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 28px 150px;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  column-gap: 60px;
  align-items: start;
}
main { padding-top: 40px; min-width: 0; }

/* ---------- rail ---------- */
.rail {
  position: sticky; top: 0;
  padding: 40px 0;
  max-height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  font-size: 11.5px; line-height: 1.45;
  scrollbar-width: thin;
}
.rail-head {
  font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
  padding-bottom: 10px; border-bottom: 1px solid var(--rule);
}
.toc summary {
  display: none; cursor: pointer; list-style: none;
  font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mid);
  padding: 8px 0;
}
.toc summary::-webkit-details-marker { display: none; }
.rail-nav { display: flex; flex-direction: column; gap: 1px; }
.rail-nav a {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px;
  padding: 3px 6px 3px 8px; color: var(--ink-mid); text-decoration: none;
  border-left: 2px solid transparent;
}
.rail-nav a:hover { color: var(--ink); border-left-color: var(--marine); background: var(--surface); }
.rail-nav a.on { color: var(--ink); border-left-color: var(--marine); font-weight: 500; }
.rail-nav a.read .t { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--rule); }
.rail-nav .n { color: var(--brass); font-variant-numeric: tabular-nums; }
.rail-nav .sep {
  margin: 10px 0 4px 8px; color: var(--ink-soft); letter-spacing: .12em; text-transform: uppercase;
  font-size: 10px; opacity: .8;
}
.progress-box { display: flex; flex-direction: column; gap: 7px; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; color: var(--ink-soft); letter-spacing: .08em; text-transform: uppercase; font-size: 10px; }
.progress-row b { color: var(--ink); font-weight: 600; font-size: 12px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--surface-sunk); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--marine); transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
.rail-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool-btn {
  font: inherit; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  background: transparent; color: var(--ink-soft); border: 1px solid var(--rule); padding: 5px 9px; cursor: pointer;
}
.tool-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

/* ---------- masthead ---------- */
.masthead { border-bottom: 2px solid var(--ink); padding-bottom: 26px; margin-bottom: 8px; }
.eyebrow {
  font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--brass); display: block; margin-bottom: 16px;
}
.eyebrow a { color: inherit; }
.masthead h1 { font-size: clamp(42px, 6.6vw, 78px); line-height: .95; font-weight: 800; letter-spacing: -0.035em; margin-bottom: 18px; }
.standfirst { font-size: 20px; line-height: 1.5; color: var(--ink-mid); max-width: 36em; margin: 0; }
.masthead-meta { display: flex; flex-wrap: wrap; margin-top: 26px; border-top: 1px solid var(--rule); }
.masthead-meta div { flex: 1 1 130px; padding: 14px 18px 0 0; font-family: "IBM Plex Mono", monospace; }
.masthead-meta .k { display: block; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
.masthead-meta .v { font-size: 21px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- prose rhythm ---------- */
.prose > * { max-width: 66ch; }
.prose > p { margin: 0 0 16px; }
.prose > header, .prose > h2, .prose > figure, .prose > .table-wrap, .prose > .exercises,
.prose > .traps, .prose > .ch-end, .prose > ol.rules19 { max-width: none; }

h2.sec {
  font-size: 13px; font-family: "IBM Plex Mono", monospace; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  padding-bottom: 9px; border-bottom: 1px solid var(--rule); margin: 64px 0 22px;
}

.keyidea {
  background: var(--surface); border-left: 3px solid var(--marine);
  padding: 20px 22px; margin: 26px 0 0; max-width: 66ch;
}
.keyidea .k { font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--marine); display: block; margin-bottom: 8px; }
.keyidea p { margin: 0 0 10px; font-size: 17.5px; }
.keyidea p:last-child { margin-bottom: 0; }

/* ---------- parts ---------- */
.part {
  margin: 110px 0 0; padding: 26px 0 22px;
  border-top: 6px solid var(--ink); border-bottom: 1px solid var(--rule);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px;
  scroll-margin-top: 16px;
}
.part-num { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
.part h2 { font-size: clamp(34px, 4.6vw, 52px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.part p { margin: 8px 0 0; color: var(--ink-mid); font-size: 17.5px; max-width: 60ch; }

/* ---------- chapter ---------- */
.chapter { margin-top: 70px; scroll-margin-top: 16px; }
.ch-head { border-top: 1px solid var(--ink); padding-top: 16px; margin-bottom: 30px; }
.ch-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.ch-num { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--brass); letter-spacing: .1em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.chapter h3 { font-size: clamp(30px, 3.8vw, 40px); line-height: 1.05; margin-bottom: 12px; letter-spacing: -0.025em; }
.ch-meta { display: flex; flex-wrap: wrap; gap: 0 22px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 16px; font-variant-numeric: tabular-nums; }
.thesis { font-size: 20px; line-height: 1.5; color: var(--ink-mid); max-width: 38em; margin: 0; font-style: italic; }

.chapter h4 {
  font-size: 21px; letter-spacing: -0.015em; margin: 40px 0 12px; max-width: 66ch;
}
.chapter h4:first-child { margin-top: 0; }

/* done toggle */
.done-toggle {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
  user-select: none; margin-left: auto; position: relative;
}
.done-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.done-toggle .box { width: 14px; height: 14px; border: 1.5px solid var(--rule); display: block; position: relative; }
.done-toggle:hover .box { border-color: var(--marine); }
.done-toggle input:focus-visible + .box { outline: 2px solid var(--marine); outline-offset: 2px; }
.done-toggle input:checked + .box { background: var(--marine); border-color: var(--marine); }
.done-toggle input:checked + .box::after {
  content: ""; position: absolute; left: 3.5px; top: .5px; width: 4px; height: 8px;
  border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(42deg);
}
.chapter.is-read .done-toggle { color: var(--marine); }

/* lists inside prose */
.prose ul.points, .prose ol.steps { padding: 0; margin: 0 0 18px; list-style: none; }
.prose ul.points li { position: relative; padding: 5px 0 5px 22px; }
.prose ul.points li::before { content: ""; position: absolute; left: 3px; top: 15px; width: 7px; height: 7px; background: var(--rule); }
.prose ol.steps { counter-reset: step; }
.prose ol.steps li { counter-increment: step; position: relative; padding: 6px 0 6px 38px; }
.prose ol.steps li::before {
  content: counter(step, decimal-leading-zero); position: absolute; left: 0; top: 9px;
  font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; color: var(--brass);
}
.prose li b, .prose p b { font-weight: 600; }

/* ---------- code ---------- */
figure { margin: 0; }
figure.code { margin: 20px 0 22px; border: 1px solid var(--rule-soft); background: var(--code-bg); }
figure.code figcaption {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--rule-soft);
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .08em; color: var(--ink-soft);
}
figure.code figcaption .tag { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mid); }
figure.code.before { border-top: 2px solid var(--gap); }
figure.code.before figcaption .tag { color: var(--gap); }
figure.code.after { border-top: 2px solid var(--ok); }
figure.code.after figcaption .tag { color: var(--ok); }
figure.code figcaption .file { text-transform: none; letter-spacing: 0; }
pre {
  margin: 0; padding: 14px 16px 16px; overflow-x: auto;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13.4px; line-height: 1.58; color: var(--code-ink);
  tab-size: 4;
}
pre code { font-family: inherit; background: none; padding: 0; white-space: pre; }
.exercise pre, .solution pre { background: var(--code-bg); border: 1px solid var(--rule-soft); margin: 12px 0 14px; }

.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag { color: var(--syn-kw); }
.hljs-keyword { font-weight: 500; }
.hljs-string, .hljs-regexp, .hljs-char.escape_ { color: var(--syn-str); }
.hljs-comment, .hljs-quote { color: var(--syn-com); font-style: italic; }
.hljs-number, .hljs-symbol, .hljs-bullet { color: var(--syn-num); }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section { color: var(--syn-fn); font-weight: 600; }
.hljs-meta, .hljs-meta .hljs-keyword, .hljs-attr, .hljs-attribute, .hljs-variable.language_ { color: var(--syn-meta); }
.hljs-params { color: inherit; }
.hljs-subst { color: var(--code-ink); }
.hljs-addition { color: var(--ok); background: var(--ok-bg); display: inline-block; width: 100%; }
.hljs-deletion { color: var(--gap); background: var(--gap-bg); display: inline-block; width: 100%; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 600; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 18px 0 24px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15px; line-height: 1.45; }
th, td { text-align: left; padding: 10px 16px 10px 0; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
th {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-soft); border-bottom: 1px solid var(--rule); white-space: nowrap;
}
td:first-child { font-weight: 600; font-family: Archivo, sans-serif; font-size: 14.5px; letter-spacing: -.005em; }
tbody tr:last-child td { border-bottom: 1px solid var(--rule); }
td.mono, td .mono { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 400; }

/* ---------- diagrams ---------- */
figure.diagram { margin: 24px 0 28px; }
figure.diagram svg { display: block; width: 100%; height: auto; max-width: 820px; }
figure.diagram figcaption { font-size: 15px; color: var(--ink-soft); font-style: italic; margin-top: 10px; max-width: 64ch; }
.dg-iface { fill: var(--marine-sunk); stroke: var(--marine); stroke-width: 1.25; }
.dg-body { fill: var(--surface); stroke: var(--ink-soft); stroke-width: 1; }
.dg-hot { fill: var(--marine-sunk); stroke: var(--marine); stroke-width: 1.25; }
.dg-box { fill: var(--surface); stroke: var(--ink-soft); stroke-width: 1; }
.dg-dead { fill: none; stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 4 4; opacity: .7; }
.dg-edge { stroke: var(--ink-soft); stroke-width: 1.2; fill: none; }
.dg-title { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; letter-spacing: .12em; fill: var(--ink-mid); }
.dg-label { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 500; fill: var(--ink); }
.dg-small { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; fill: var(--ink-soft); }
.dg-note { font-family: "Source Serif 4", Georgia, serif; font-size: 13px; font-style: italic; fill: var(--ink-soft); }
.dg-sep { stroke: var(--rule); stroke-width: 1; }


/* ---------- sequence diagrams ---------- */
.dg-life { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 4; }
.dg-head { fill: var(--surface); stroke: var(--ink-soft); stroke-width: 1; }
.dg-msg { stroke: var(--ink-soft); stroke-width: 1.2; fill: none; }
.dg-msg-hot { stroke: var(--marine); stroke-width: 1.7; fill: none; }
.dg-msg-label { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; fill: var(--ink-mid); }
.dg-msg-label.hot { fill: var(--marine); font-weight: 600; }
.dg-step { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; fill: var(--brass); }


/* ---------- fleet diagrams ---------- */
.dg-proc { stroke: var(--ink-soft); stroke-width: 1.4; }
.dg-dot { fill: var(--ink-soft); }
.dg-dot-hot { fill: var(--marine); }
.dg-msg-async { stroke: var(--ink-soft); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
.dg-ring { fill: none; stroke: var(--rule); stroke-width: 2; }
.dg-arc-hot { fill: none; stroke: var(--marine); stroke-width: 5; stroke-linecap: round; }
.dg-node { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.dg-node-hot { fill: var(--marine); stroke: var(--marine); stroke-width: 1.5; }
.dg-doubt { fill: var(--gap-bg); stroke: var(--gap); stroke-width: 1; }
.dg-gap-text { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; fill: var(--gap); font-weight: 600; }
.dg-cross { stroke: var(--gap); stroke-width: 2.5; stroke-linecap: round; }
.dg-hot-text { fill: var(--marine); font-weight: 600; }
.dg-faint { opacity: .3; }

/* ---------- traps ---------- */
.traps { margin: 34px 0 0; border-top: 1px solid var(--rule); padding-top: 14px; }
.block-h {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px;
}
.traps .block-h { color: var(--gap); }
.traps ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr)); gap: 4px 34px; }
.traps li { padding: 9px 0; border-bottom: 1px dotted var(--rule); font-size: 15.5px; line-height: 1.5; color: var(--ink-mid); }
.traps li b { color: var(--ink); font-family: Archivo, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: -.005em; }

/* ---------- exercises ---------- */
.exercises { margin: 38px 0 0; }
.exercises > .block-h { color: var(--brass); margin-bottom: 12px; }
.exercise {
  background: var(--surface); border-left: 3px solid var(--brass);
  padding: 18px 20px 16px; margin: 0 0 14px;
}
.ex-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.ex-num { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
.ex-title { font-family: Archivo, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.exercise > p, .solution p { margin: 0 0 10px; max-width: 64ch; font-size: 16px; }
.exercise ol, .exercise ul, .solution ol, .solution ul { margin: 0 0 12px; padding-left: 22px; font-size: 15.5px; max-width: 66ch; }
.exercise li, .solution li { margin-bottom: 5px; }
.solution { margin-top: 6px; border-top: 1px dashed var(--rule); padding-top: 10px; }
.solution summary {
  cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mid); padding: 4px 0; width: fit-content;
}
.solution summary:hover { color: var(--marine); }
.solution[open] summary { color: var(--marine); margin-bottom: 10px; }
.solution .sol-body { border-left: 2px solid var(--ok); padding-left: 16px; }

/* ---------- chapter end ---------- */
.ch-end { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; margin: 34px 0 0; padding-top: 16px; border-top: 1px solid var(--rule); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { position: relative; padding: 5px 0 5px 28px; font-size: 15.5px; line-height: 1.45; }
.checklist li::before { content: ""; position: absolute; left: 0; top: 5px; width: 11px; height: 11px; border: 1.5px solid var(--ink-soft); margin-top: 5px; }
ul.res { list-style: none; margin: 0; padding: 0; }
